<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Chess Opening Statistics</title>
        <link rel="stylesheet" href="report.css">
        <script type="module" src="report.js" defer></script>
        <script
            type="module"
            src="https://unpkg.com/chessboard-element?module">
        </script>
    </head>

    <body>
        <div class="page">
            <header>
                <div class="title-and-navbar">
                    <h1>Chess Opening Statistics</h1>

                    <nav>
                        <a class="nav-link" href="About">About Us</a>
                        <a class="nav-link" href="Github">Github Link</a>
                    </nav>
                </div>

                <div class="search-div">
                    <input class="opening-search-input">
                    <button class="opening-search-button">Search</button>

                    <div class="suggestions"></div>
                </div>
            </header>

            <div class="display-main">
                <h2 class="curr-opening-title"></h2>
                <div class="report-main">
                    <div class="opening-intro-box">
                    <div class="wording-and-board">
                        <div class="chess-board-report">
                            <chess-board position="start" hide-notation></chess-board>
                        </div>
                        <div class="intro-text">
                            <p class="opening-description"></p>
                        </div>
                    </div>
                </div>
                <div class="analyze-side">
                    <div class="elo-adjusting-bar"></div>
                    <div class="analyze-box"></div>
                </div>
                </div>
            </div>
        </div>
    </body>
</html>
